# Data configuration
data:
  video_dir: "data/videos"
  output_dir: "data/frames"
  train_split: 0.8
  num_workers: 4

# Image configuration
image:
  width: 32
  height: 24
  channels: 3

# Model configuration
model:
  input_frames: 10 # Number of previous frames to use
  output_frames: 10 # Number of future frames to predict
  feature_dim: 256 # Feature vector dimension
  nhead: 8 # Number of attention heads
  num_layers: 4 # Number of transformer layers
  dim_feedforward: 1024 # Feedforward dimension
  dropout: 0.1

# Loss configuration
loss:
  mse_weight: 1.0
  temporal_weight: 2.0      # Emphasize temporal consistency
  gradient_weight: 1.0
  perceptual_weight: 0.1
  flow_weight: 0.0          # Disabled by default, can be enabled
  predict_residual: true    # Predict differences, not absolute frames

# Training configuration
training:
  batch_size: 8
  epochs: 1000
  learning_rate: 0.0001
  weight_decay: 0.0001
  save_interval: 500 # Save checkpoint every N epochs
  gradient_clip: 1.0
  scheduler: "reduce_on_plateau"
  scheduler_patience: 10
  scheduler_factor: 0.5

# Paths
paths:
  checkpoint_dir: "checkpoints"
  output_dir: "outputs"
  best_model: "checkpoints/best_model.pth"
  input_video: "data/videos/mousemove2.MOV" # Video file for inference

# Device
device: "cuda" # "cuda" or "cpu"
