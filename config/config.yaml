# Data configuration
data:
  video_dir: "data/videos"
  output_dir: "data/frames"
  train_split: 0.8

# Image configuration
image:
  width: 320
  height: 240
  channels: 3

# Model configuration
model:
  input_frames: 5 # Number of previous frames to use
  output_frames: 1 # Number of future frames to predict
  feature_dim: 256 # Feature vector dimension
  nhead: 8 # Number of attention heads
  num_layers: 4 # Number of transformer layers
  dim_feedforward: 1024 # Feedforward dimension
  dropout: 0.1

# Training configuration
training:
  batch_size: 8
  epochs: 10
  learning_rate: 0.0001
  weight_decay: 0.0001
  save_interval: 10 # Save checkpoint every N epochs

# Paths
paths:
  checkpoint_dir: "checkpoints"
  output_dir: "outputs"
  best_model: "checkpoints/best_model.pth"
  input_video: "data/videos/test_video.mp4" # Video file for inference

# Device
device: "cuda" # "cuda" or "cpu"
